<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="checkbox" id="flip">

    <label for="flip" class="card-container" aria-label="Click to flip business card">
        <div class="card">
            <div class="card-face front">
                <img src="front.jpg" alt="Business Card Front">
            </div>

            <div class="card-face back">
                <img src="back.jpg" alt="Business Card Back">
            </div>
        </div>
    </label>
</body>
</html>
